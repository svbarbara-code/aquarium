<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aquarium">
<meta name="theme-color" content="#04182e">
<meta name="robots" content="noindex,nofollow">
<title>Aquarium</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">
<style>
:root{--glass:rgba(10,30,50,.42);--line:rgba(255,255,255,.16);--ink:#eef6fb;--soft:rgba(238,246,251,.68);--good:#7fe0b0;--warn:#ffc96b;--bad:#ff8a7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#04182e;color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;display:block}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border-radius:16px}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:calc(env(safe-area-inset-left) + 16px);right:calc(env(safe-area-inset-right) + 16px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;transition:opacity .8s}
#hud.idle{opacity:.18}
#stats{padding:9px 14px;display:flex;gap:14px;align-items:center;font-size:13px;pointer-events:auto}
#stats b{font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
button{font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:9px 16px;cursor:pointer;pointer-events:auto;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
button:active{transform:scale(.97)}
#panel{background:rgba(6,22,40,.78);position:fixed;top:calc(env(safe-area-inset-top) + 64px);right:calc(env(safe-area-inset-right) + 16px);width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;padding:16px;transition:opacity .25s,transform .25s}
#panel[hidden]{display:block;opacity:0;transform:translateY(-8px);pointer-events:none}
#panel h2{font-size:17px;font-weight:600;margin:0 0 4px}
#panel .sub{color:var(--soft);font-size:12.5px;margin:0 0 12px}
.fish{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.fish .nm{font-weight:600}
.fish .nm small{font-weight:400;color:var(--soft);margin-left:6px}
.fish .mood{font-size:12.5px;color:var(--soft);text-align:right}
.bars{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 8px;align-items:center;font-size:11.5px;color:var(--soft);margin-top:4px}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.rn{background:none;border:0;padding:0 0 0 6px;color:var(--soft);font-size:12px;text-decoration:underline;-webkit-backdrop-filter:none;backdrop-filter:none}
.next{border-top:1px solid var(--line);padding-top:12px;margin-top:4px;font-size:13px;color:var(--soft)}
.help{font-size:12.5px;color:var(--soft);margin-top:10px;line-height:1.55}
#calBox .stat{font-size:13px;color:var(--soft);margin:4px 0 8px}#calBox .err{color:var(--bad)}#calBox .btns{display:flex;gap:8px;margin-top:6px}#calBox button{font-size:13px;padding:7px 14px}
#medBtn{position:fixed;left:calc(env(safe-area-inset-left) + 16px);bottom:calc(env(safe-area-inset-bottom) + 20px);padding:12px 18px;font-size:16px;background:rgba(40,20,60,.62);border-color:rgba(255,190,240,.45);text-align:left;line-height:1.25;animation:medPulse 2.4s ease-in-out infinite}
#medBtn small{display:block;font-size:12px;color:var(--soft)}
#medBtn[hidden]{display:none}
@keyframes medPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,170,230,.0)}50%{box-shadow:0 0 0 8px rgba(255,170,230,.18)}}
.mlog{font-size:12.5px;color:var(--soft);margin-top:8px}
.mlog .day{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 0;border-top:1px solid rgba(255,255,255,.07)}
.mlog .day b{width:58px;font-weight:500;color:var(--ink)}
.chip{padding:2px 8px;border-radius:9px;font-size:11.5px}
.chip.ok{background:rgba(127,224,176,.16);color:var(--good)}.chip.miss{background:rgba(255,138,122,.16);color:var(--bad)}.chip.wait{background:rgba(255,201,107,.16);color:var(--warn)}
#tip{pointer-events:none;position:fixed;z-index:5;max-width:280px;padding:12px 14px;font-size:14px;line-height:1.35;background:rgba(40,20,60,.82);border-color:rgba(255,190,240,.45)}
#tip[hidden]{display:none}
#tip b{display:block;font-size:12px;font-weight:500;color:var(--soft);margin-bottom:4px}
#tip ul{margin:0 0 8px;padding-left:18px}
#tip button{font-size:13px;padding:7px 14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translate(-50%,20px);padding:12px 20px;font-size:15px;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#meal{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translate(-50%,-10px);padding:12px 22px;font-size:16px;text-align:center;opacity:0;transition:opacity .6s,transform .6s;pointer-events:none;background:rgba(6,22,40,.7)}
#meal.on{opacity:1;transform:translate(-50%,0)}
#meal small{display:block;font-size:12.5px;color:var(--soft);margin-top:2px}
.meals h3{font-size:15px;font-weight:600;margin:16px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:1fr 110px 34px;gap:8px;margin:6px 0}
.meals input{font:inherit;font-size:14px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:100%;-webkit-user-select:text;user-select:text;color-scheme:dark}
.meals .mrow4{grid-template-columns:1fr 92px 70px 32px;gap:6px}.meals select{font:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;padding:7px 6px;width:100%;color-scheme:dark}
.meals .x{padding:0;border-radius:10px}
.meals .add{margin-top:6px;font-size:13px;padding:7px 14px}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translateX(-50%);padding:10px 18px;font-size:14px;color:var(--soft);transition:opacity 1s;pointer-events:none}
</style>
</head>
<body>
<canvas id="tank"></canvas>
<div id="hud">
  <div id="stats" class="glass"></div>
  <button id="fishBtn">Fish</button>
</div>
<div id="panel" class="glass" hidden><div id="fishList"></div><div id="mealsBox" class="meals"></div><div id="medBox" class="meals"></div><div id="calBox" class="meals"></div></div>
<button id="medBtn" hidden></button>
<div id="tip" class="glass" hidden></div>
<div id="meal" class="glass"></div>
<div id="hint" class="glass">Tap to feed · swipe across the glass to clean</div>
<div id="toast" class="glass"></div>
<script>
'use strict';
/* ---------- config ---------- */
const Q = new URLSearchParams(location.search);
const SIM = Math.max(1, +Q.get('speed') || 1);          // test: ?speed=360 → 1 real second = 6 sim minutes
const HOUR_OVERRIDE = Q.has('hour') ? +Q.get('hour') : null; // test: ?hour=22
const TEST_CALL = Q.has('testcall');                     // test: ?testcall → fake call starting in ~4 min
const KEY = 'aquarium.v1';
const DEFAULT_MEALS = [{label:'Breakfast',time:'08:00'},{label:'Lunch',time:'12:30'},{label:'Snack',time:'16:00'},{label:'Dinner',time:'19:30'}];
const MEAL_HUNGER = 15;   // at each meal time every fish drops to this "full" level
const RATE = { hunger: 1.5, dirt: 1.4, pelletDirt: 1.3, growth: 1/96 }; // per sim hour; growth = 4 good days to full size

const SPECIES = {
  goldfish:{label:'Goldfish',  len:46,h:.60,top:'#c9561c',mid:'#f39a3c',belly:'#ffe2ad',fin:'#f6a85a',finA:.72,tail:'fan', dorsal:'mid',  pattern:'scales',speed:.8, band:[.22,.68]},
  neon:    {label:'Neon tetra',len:22,h:.36,top:'#6f8295',mid:'#b8c6d3',belly:'#eef3f7',fin:'#dfe7ee',finA:.30,tail:'fork',dorsal:'small',pattern:'neon',  speed:1.25,band:[.28,.62],school:true},
  guppy:   {label:'Guppy',     len:26,h:.40,top:'#8d8676',mid:'#c9c2b0',belly:'#f0eadb',fin:'#ff7446',finA:.85,tail:'big', dorsal:'small',pattern:'spots', speed:1.0, band:[.16,.55],tailPattern:true},
  angel:   {label:'Angelfish', len:38,h:.92,top:'#a9a28f',mid:'#e7e2d3',belly:'#f7f4ea',fin:'#e3ddcc',finA:.55,tail:'fork',dorsal:'tall', pattern:'bars',  speed:.6, band:[.26,.64]},
  betta:   {label:'Betta',     len:32,h:.48,top:'#1d2c8f',mid:'#3d55d0',belly:'#6c7fe6',fin:'#d22a52',finA:.82,tail:'veil',dorsal:'long', pattern:'iris',  speed:.5, band:[.12,.48]},
  discus:  {label:'Discus',    len:40,h:.98,top:'#a63b1f',mid:'#e2733f',belly:'#f4a86f',fin:'#d8683a',finA:.6, tail:'small',dorsal:'round',pattern:'waves', speed:.5, band:[.3,.66]},
  cory:    {label:'Cory catfish',len:24,h:.46,top:'#7d7466',mid:'#b9ae9a',belly:'#efe6d4',fin:'#cfc6b4',finA:.5,tail:'fork',dorsal:'mid',pattern:'dots',speed:.7, band:[.80,.86],bottom:true}
};
const UNLOCKS = [
  {at:12,  sp:'angel',  name:'Luna'},
  {at:36,  sp:'betta',  name:'Rubi'},
  {at:72,  sp:'discus', name:'Sol'},
  {at:120, sp:'cory',   name:'Bolinha'}
];
const STARTERS = [['goldfish','Mango'],['neon','Zip'],['neon','Spark'],['neon','Blue'],['guppy','Pip']];

/* ---------- state ---------- */
let S = load() || fresh();
function fresh(){
  return {fish: STARTERS.map(([sp,name],i)=>newFish(sp,name,i)), dirt:8, care:0, unlocked:[], last:Date.now(), seen:false};
}
function newFish(sp,name,i){return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)+(i||0), sp, name, full:70, growth:.35, born:Date.now()}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.fish?s:null}catch(e){return null}}
function save(){S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- simulation (sim hours) ---------- */
const queuedToasts=[];
function simulate(h){
  let fullSum=0;
  for(const f of S.fish){
    f.full=Math.max(0,f.full-RATE.hunger*h);
    fullSum+=f.full;
    if(f.full>=40 && S.dirt<60) f.growth=Math.min(1,f.growth+RATE.growth*h);
  }
  S.dirt=Math.min(100,S.dirt+RATE.dirt*h);
  if(fullSum/S.fish.length>=40 && S.dirt<50 && !overdueDose()){
    S.care+=h;
    for(const u of UNLOCKS){
      if(S.care>=u.at && !S.unlocked.includes(u.sp)){
        S.unlocked.push(u.sp);
        const f=newFish(u.sp,u.name);f.full=80;S.fish.push(f);spawn(f,true);
        queuedToasts.push(`A new ${SPECIES[u.sp].label.toLowerCase()} arrived: say hi to ${u.name}`);
      }
    }
  }
}
function catchUp(){
  let hrs=Math.min((Date.now()-S.last)/36e5*SIM, 24*14);
  while(hrs>0){const step=Math.min(.25,hrs);simulate(step);hrs-=step}
}
if(!S.meals)S.meals=DEFAULT_MEALS.map(m=>({...m}));
if(!S.mealCheck)S.mealCheck=Date.now();
if(!S.cal)S.cal={url:'',calls:[],fetched:0,err:''};
if(!S.popped)S.popped={};
if(!S.meds)S.meds=[];if(!S.medLog)S.medLog=[];if(!S.medCheck)S.medCheck=Date.now();
for(const k in S.popped)if(Date.now()-S.popped[k]>3*864e5)delete S.popped[k];

/* ---------- meal times: the fish get hungry when you're meant to eat ---------- */
function mealOccurrences(from,to){
  const out=[];const d=new Date(from);d.setHours(0,0,0,0);
  for(;d.getTime()<=to;d.setDate(d.getDate()+1)){
    for(const m of S.meals){
      const[hh,mm]=(m.time||'').split(':').map(Number);if(isNaN(hh))continue;
      const t=new Date(d);t.setHours(hh,mm||0,0,0);const ts=t.getTime();
      if(ts>from&&ts<=to)out.push({label:m.label||'Meal',at:ts});
    }
  }
  return out.sort((a,b)=>a.at-b.at);
}
function checkMeals(){
  const now=Date.now(),occ=mealOccurrences(S.mealCheck,now);S.mealCheck=now;
  if(!occ.length)return;
  for(const f of S.fish)f.full=Math.min(f.full,MEAL_HUNGER);
  S.mealNow=occ[occ.length-1];save();
}
function nextMeal(){const n=Date.now();return mealOccurrences(n,n+864e5*2)[0]}
const mealEl=document.getElementById('meal');
function renderMealBanner(){
  const m=S.mealNow,avg=S.fish.reduce((a,f)=>a+f.full,0)/S.fish.length;
  const on=m&&Date.now()-m.at<2*36e5&&avg<55;
  if(on){mealEl.innerHTML=`${esc(m.label)} time! Your fish are hungry, and so are you.<small>Go eat something, then tap the water to feed them.</small>`;if(!S.seen)hint.style.opacity=0}
  mealEl.classList.toggle('on',!!on&&panel.hidden);
}
/* ---------- calls from Google Calendar: a bubble to pop 5 min before each call ---------- */
const CALL_LEAD=5*60e3;
const testCalls=TEST_CALL?[{id:'test-'+Date.now(),title:'Test call: DRC pipeline review',start:Date.now()+4*60e3+20e3,end:Date.now()+34*60e3}]:[];
function allCalls(){return S.cal.calls.concat(testCalls)}
async function fetchCalls(){
  if(!S.cal.url)return;
  try{
    const r=await fetch(S.cal.url+(S.cal.url.includes('?')?'&':'?')+'_='+Date.now());
    const j=await r.json();if(j.error)throw new Error(j.error);
    S.cal.calls=(j.calls||[]).filter(c=>c&&c.id&&c.start&&c.end);S.cal.fetched=Date.now();S.cal.err='';save();
    if(Array.isArray(j.meds)&&j.meds.length&&!S.medsSeeded){      // one-time: your med list arrives with the private link
      S.medsSeeded=true;
      if(!S.meds.length){
        S.meds=j.meds.filter(m=>m&&m.name&&/^\d\d:\d\d$/.test(m.time)).map((m,i)=>({id:'m'+Date.now().toString(36)+i,name:String(m.name).slice(0,28),time:m.time,day:m.day==null?-1:+m.day})).sort((a,b)=>a.time.localeCompare(b.time));
        S.medCheck=Date.now();toast(`Added your ${S.meds.length} meds. Edit them in the Fish panel.`);
      }
      save();renderMedBtn();if(!panel.hidden)renderMeds();
    }
  }catch(e){S.cal.err=String(e.message)==='unauthorized'?'The calendar link has the wrong key.':'Could not reach your calendar. Check the link or your connection.'}
  if(!panel.hidden)renderCal();
}
function nextCall(){const n=Date.now();return allCalls().filter(c=>!S.popped[c.id]&&c.start>n&&c.start-n<12*36e5).sort((a,b)=>a.start-b.start)[0]}
function dueCall(){const n=Date.now();return allCalls().filter(c=>!S.popped[c.id]&&n>=c.start-CALL_LEAD&&n<c.end).sort((a,b)=>a.start-b.start)[0]}
let bubble=null,popFx=[],ring=null,actx=null;
function updateBubble(){
  const c=dueCall();
  if(!c){bubble=null;return}
  if(!bubble||bubble.call.id!==c.id){bubble={call:c,x:W*.5,y:-Math.min(W,H)*.25,vy:0,r:Math.min(W,H)*.2,p:Math.random()*6};chime()}
}
function tone(f0,f1,dur,vol){
  try{if(!actx||actx.state!=='running')return;const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime;
    o.type='sine';o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
    g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur+.03);o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+dur+.05)}catch(e){}
}
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state!=='running')actx.resume()}catch(e){}}
function chime(){tone(320,640,.25,.12);setTimeout(()=>tone(480,960,.3,.1),180)}
function popBubble(){
  const b=bubble;S.popped[b.call.id]=Date.now();save();
  for(let i=0;i<46;i++){const a=Math.random()*Math.PI*2,sp=(120+Math.random()*380)*U;popFx.push({x:b.x+Math.cos(a)*b.r*.95,y:b.y+Math.sin(a)*b.r*.95,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,r:(1.5+Math.random()*4)*U})}
  ring={x:b.x,y:b.y,r:b.r,life:1};bubble=null;
  tone(900,140,.12,.35);toast('Have a good call!');
}
function wrapText(txt,maxW){
  const words=txt.split(/\s+/),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(c.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}
  if(cur)lines.push(cur);
  if(lines.length>2){lines.length=2;while(c.measureText(lines[1]+'…').width>maxW&&lines[1].length>1)lines[1]=lines[1].slice(0,-1);lines[1]+='…'}
  return lines;
}
function drawBubble(t){
  const b=bubble;if(!b)return;const r=b.r,wob=Math.sin(t*2.1+b.p)*.035;
  c.save();c.translate(b.x,b.y);
  c.save();c.scale(1+wob,1-wob);
  let g=c.createRadialGradient(-r*.3,-r*.35,r*.05,0,0,r);
  g.addColorStop(0,'rgba(255,255,255,.22)');g.addColorStop(.65,'rgba(150,215,255,.12)');g.addColorStop(.9,'rgba(200,170,255,.30)');g.addColorStop(1,'rgba(255,255,255,.6)');
  c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,7);c.fill();
  c.lineWidth=3*U;c.strokeStyle=`hsla(${(t*45)%360},90%,82%,.6)`;c.beginPath();c.arc(0,0,r*.985,0,7);c.stroke();
  c.lineWidth=2*U;c.strokeStyle=`hsla(${(t*45+150)%360},90%,82%,.35)`;c.beginPath();c.arc(0,0,r*.95,.4,2.6);c.stroke();
  c.fillStyle='rgba(255,255,255,.8)';c.beginPath();c.ellipse(-r*.45,-r*.52,r*.2,r*.08,-.7,0,7);c.fill();
  c.beginPath();c.arc(-r*.2,-r*.7,r*.035,0,7);c.fill();
  c.restore();
  const mins=Math.ceil((b.call.start-Date.now())/60e3);
  c.textAlign='center';c.textBaseline='middle';c.shadowColor='rgba(0,20,40,.65)';c.shadowBlur=8*U;
  c.fillStyle='#fff';c.font=`600 ${r*.15}px -apple-system,system-ui,sans-serif`;
  c.fillText(mins>0?`Call in ${mins} min`:'Your call has started',0,-r*.3);
  c.font=`500 ${r*.115}px -apple-system,system-ui,sans-serif`;
  wrapText(b.call.title,r*1.5).forEach((ln,i)=>c.fillText(ln,0,-r*.06+i*r*.15));
  c.fillStyle='rgba(238,246,251,.85)';c.font=`${r*.1}px -apple-system,system-ui,sans-serif`;
  c.fillText(fmtClock(b.call.start)+' – '+fmtClock(b.call.end),0,r*.36);
  c.fillStyle='rgba(238,246,251,.7)';c.font=`${r*.08}px -apple-system,system-ui,sans-serif`;
  c.fillText('Tap to pop',0,r*.56);
  c.restore();
}
function drawPop(){
  if(ring){c.strokeStyle=`rgba(255,255,255,${ring.life*.6})`;c.lineWidth=4*U*ring.life;c.beginPath();c.arc(ring.x,ring.y,ring.r*(1.35-ring.life*.35),0,7);c.stroke()}
  for(const d of popFx){c.fillStyle=`rgba(225,245,255,${d.life*.85})`;c.beginPath();c.arc(d.x,d.y,d.r,0,7);c.fill()}
}
/* ---------- meds: give the fish their medicine when you take yours ---------- */
const MED_EARLY=60*60e3;
function medOccurrences(from,to){
  const out=[];const d=new Date(from);d.setHours(0,0,0,0);
  for(;d.getTime()<=to;d.setDate(d.getDate()+1))for(const m of S.meds){
    if(m.day!=null&&m.day>=0&&d.getDay()!==+m.day)continue;
    const[hh,mm]=(m.time||'').split(':').map(Number);if(isNaN(hh))continue;
    const t=new Date(d);t.setHours(hh,mm||0,0,0);const ts=t.getTime();
    if(ts>from&&ts<=to)out.push({id:m.id+'@'+ts,medId:m.id,name:m.name||'Medicine',due:ts});
  }
  return out.sort((a,b)=>a.due-b.due);
}
function missAt(due){const e=new Date(due);e.setHours(23,59,59,999);return Math.max(e.getTime(),due+4*36e5)}
function checkMeds(){
  const now=Date.now(),have=new Set(S.medLog.map(d=>d.id));
  for(const o of medOccurrences(S.medCheck,now))if(!have.has(o.id))S.medLog.push({...o,given:null,missed:false});
  S.medCheck=now;
  for(const d of S.medLog)if(!d.given&&!d.missed&&now>missAt(d.due))d.missed=true;
  S.medLog=S.medLog.filter(d=>now-d.due<60*864e5);
}
function pendingDoses(){return S.medLog.filter(d=>!d.given&&!d.missed).sort((a,b)=>a.due-b.due)}
function overdueDose(){const n=Date.now();return S.medLog.some(d=>!d.given&&!d.missed&&n-d.due>2*36e5)}
function upcomingDose(){const n=Date.now(),have=new Set(S.medLog.map(d=>d.id));return medOccurrences(n,n+MED_EARLY).find(o=>!have.has(o.id))}
let capsule=null,sparks=[],SICK=false,pillBubble=null,tipTimer=null;
function giveDoses(list){
  const now=Date.now();
  for(const d of list){if(!S.medLog.includes(d))S.medLog.push(d);d.given=now;d.missed=false}
  save();
  capsule={x:W*(.35+Math.random()*.3),y:-30*U,vy:70*U,rot:Math.random()*6};
  toast(list.length>1?`Logged ${list.length} meds at ${fmtClock(now)}`:`Logged: ${list[0].name} at ${fmtClock(now)}`);
  renderMedBtn();if(!panel.hidden)renderMeds();
}
const medBtn=document.getElementById('medBtn');
let GIVE=null;   // the dose group the fish can be given right now (due, or up to 60 min early)
function giveableGroup(){
  const p=pendingDoses();
  if(p.length)return p.filter(d=>d.due===p[0].due);
  const u=upcomingDose();if(!u)return null;
  const have=new Set(S.medLog.map(d=>d.id));
  const g=medOccurrences(u.due-1,u.due).filter(o=>!have.has(o.id)).map(o=>({...o,given:null,missed:false}));
  return g.length?g:null;
}
function giveNow(){if(!GIVE)return;poke();unlockAudio();tone(660,990,.18,.18);hideTip();giveDoses(GIVE);GIVE=null}
function renderMedBtn(){medBtn.hidden=true;GIVE=giveableGroup();if(!GIVE)hideTip()}
const tip=document.getElementById('tip');
function sickFishAt(x,y){
  if(!GIVE)return false;
  if(pillBubble&&Math.hypot(x-pillBubble.x,y-pillBubble.y)<pillBubble.r)return true;
  return S.fish.some(f=>Math.hypot(x-f.x,y-f.y)<Math.max(22*U,fishLen(f)*.6));
}
function showTip(x,y,sticky){
  const g=GIVE;if(!g)return hideTip();const early=g[0].due>Date.now();
  const more=pendingDoses().length-(early?0:g.length);
  tip.innerHTML=`<b>${early?`Meds due at ${fmtClock(g[0].due)}`:`The fish need their ${fmtClock(g[0].due)} meds`}</b><ul>${g.map(d=>`<li>${esc(d.name)}</li>`).join('')}</ul>${more>0?`<p style="margin:0 0 6px;font-size:12px;color:var(--soft)">+${more} more due after these</p>`:''}<p style="margin:0;font-size:12.5px;color:var(--soft)">${matchMedia('(hover:hover)').matches?'Click':'Tap'} the fish to give ${g.length>1?'them':'it'}.</p>`;
  tip.hidden=false;

  tip.style.top=Math.max(12,y-h-24<12?y+28:y-h-24)+'px';
  clearTimeout(tipTimer);tipTimer=sticky?setTimeout(hideTip,6000):null;
}
function hideTip(){tip.hidden=true;clearTimeout(tipTimer);tipTimer=null}
function drawMeds(t){
  pillBubble=null;
  if(GIVE&&S.fish.length){const f=S.fish.reduce((a,b)=>fishLen(b)>fishLen(a)?b:a),L=fishLen(f),bob=Math.sin(t*1.6)*3*U;
    const bx=f.x+Math.sign(f.dir||1)*L*.45,by=f.y-L*.95+bob;
    c.fillStyle='rgba(255,255,255,.85)';
    [[.0,.0,3.5],[.22,-.3,6]].forEach(([dx,dy,r])=>{c.beginPath();c.arc(f.x+Math.sign(f.dir||1)*L*(.22+dx),f.y-L*(.42-dy),r*U,0,7);c.fill()});
    c.beginPath();c.arc(bx,by,26*U,0,7);c.fill();pillBubble={x:bx,y:by,r:30*U};
    c.save();c.translate(bx,by);c.rotate(-.5);const w=14*U,h=6.5*U;

    c.fillStyle='#6f52c9';c.beginPath();c.roundRect?c.roundRect(0,-h,w,h*2,h):c.rect(0,-h,w,h*2);c.fill();c.strokeStyle='rgba(40,20,60,.55)';c.lineWidth=1.2*U;c.beginPath();c.roundRect?c.roundRect(-w,-h,w*2,h*2,h):c.rect(-w,-h,w*2,h*2);c.stroke();c.fillStyle='rgba(255,255,255,.55)';c.fillRect(-w*.7,-h*.55,w*1.2,h*.35);c.restore()}
  for(const f of S.fish){if(!(f.glow>0))continue;const L=fishLen(f);
    for(let k=0;k<5;k++){const a=t*2.2+k*1.26+f.ph*.1;c.fillStyle=`rgba(255,215,245,${Math.min(1,f.glow/3)*.75})`;c.beginPath();c.arc(f.x+Math.cos(a)*L*.7,f.y+Math.sin(a)*L*.45,(1.6+Math.sin(t*6+k))*U+1,0,7);c.fill()}}
  for(const p of sparks){c.fillStyle=`hsla(${p.h},90%,80%,${p.life})`;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill()}
  if(capsule){const k=capsule;c.save();c.translate(k.x,k.y);c.rotate(k.rot);const w=16*U,h=7*U;
    c.fillStyle='#f7f2ff';c.beginPath();c.roundRect?c.roundRect(-w,-h,w,h*2,h):c.rect(-w,-h,w,h*2);c.fill();
    c.fillStyle='#e05a9c';c.beginPath();c.roundRect?c.roundRect(0,-h,w,h*2,h):c.rect(0,-h,w,h*2);c.fill();
    c.fillStyle='rgba(255,255,255,.6)';c.fillRect(-w*.7,-h*.6,w*1.3,h*.35);c.restore()}
}
function mood(f){
  if(overdueDose()) return ['Waiting for medicine','var(--warn)'];
  if(f.full<20) return ['Hungry','var(--bad)'];
  if(S.dirt>60) return ['Water is murky','var(--warn)'];
  if(f.full>70&&S.dirt<30) return ['Happy','var(--good)'];
  return ['Okay','var(--soft)'];
}

/* ---------- canvas ---------- */
const cv=document.getElementById('tank'), c=cv.getContext('2d');
let W=0,H=0,DPR=1,U=1,bg=null,plants=[],motes=[];
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function floorY(x){return H*.845+Math.sin(x/W*3+1)*H*.014+Math.sin(x/W*7.3)*H*.007}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(320,innerWidth||0);H=Math.max(320,innerHeight||0);cv.width=W*DPR;cv.height=H*DPR;
  U=Math.min(W,H)/620;
  buildBackground();buildPlants();
  motes=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H*.85,r:Math.random()*1.4+.4,s:Math.random()*6+2,p:Math.random()*6}));
  for(const f of S.fish) if(f.x==null||f.x<=0||f.x>W||f.y>H) spawn(f);
}
function buildBackground(){
  bg=document.createElement('canvas');bg.width=W*DPR;bg.height=H*DPR;
  const g=bg.getContext('2d');g.scale(DPR,DPR);const r=rng(7);
  let gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#2a7fa6');gr.addColorStop(.35,'#135178');gr.addColorStop(.75,'#0a3155');gr.addColorStop(1,'#061f3a');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  // distant haze + background rock silhouettes
  for(let layer=0;layer<2;layer++){
    g.fillStyle=layer?'rgba(8,36,62,.75)':'rgba(16,58,90,.55)';
    g.beginPath();g.moveTo(0,H);
    for(let x=0;x<=W;x+=W/14){g.lineTo(x,H*(layer?.70:.62)-r()*H*(layer?.12:.16))}
    g.lineTo(W,H);g.fill();
  }
  // big rocks
  const rock=(x,w,h,hue)=>{
    const y=floorY(x)+h*.18;
    const gg=g.createLinearGradient(x-w*.3,y-h,x+w*.3,y);
    gg.addColorStop(0,`hsl(${hue},12%,46%)`);gg.addColorStop(.55,`hsl(${hue},12%,30%)`);gg.addColorStop(1,`hsl(${hue},14%,16%)`);
    g.fillStyle=gg;g.beginPath();g.moveTo(x-w/2,y);
    g.bezierCurveTo(x-w*.55,y-h*.7,x-w*.2,y-h*1.05,x+w*.08,y-h);
    g.bezierCurveTo(x+w*.38,y-h*.95,x+w*.56,y-h*.45,x+w/2,y);g.closePath();g.fill();
    g.fillStyle='rgba(255,255,255,.07)';g.beginPath();g.ellipse(x-w*.08,y-h*.78,w*.2,h*.1,-.3,0,7);g.fill();
    g.fillStyle='rgba(60,110,50,.35)';g.beginPath();g.ellipse(x-w*.15,y-h*.55,w*.12,h*.06,.4,0,7);g.fill();
  };
  rock(W*.24,190*U,120*U,210);rock(W*.34,110*U,70*U,30);rock(W*.73,150*U,95*U,200);
  // driftwood
  g.strokeStyle='#4a3726';g.lineCap='round';g.lineWidth=16*U;
  g.beginPath();g.moveTo(W*.5,floorY(W*.5)+4*U);g.bezierCurveTo(W*.56,H*.72,W*.6,H*.66,W*.67,H*.6);g.stroke();
  g.lineWidth=8*U;g.beginPath();g.moveTo(W*.585,H*.69);g.quadraticCurveTo(W*.61,H*.62,W*.6,H*.56);g.stroke();
  g.strokeStyle='rgba(255,230,190,.12)';g.lineWidth=4*U;
  g.beginPath();g.moveTo(W*.505,floorY(W*.5)-3*U);g.bezierCurveTo(W*.56,H*.715,W*.6,H*.655,W*.668,H*.596);g.stroke();
  // sand
  gr=g.createLinearGradient(0,H*.82,0,H);
  gr.addColorStop(0,'#c9b386');gr.addColorStop(.4,'#a8915f');gr.addColorStop(1,'#5e4e33');
  g.fillStyle=gr;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=8)g.lineTo(x,floorY(x));g.lineTo(W,H);g.fill();
  // pebbles
  for(let i=0;i<W*.55;i++){
    const x=r()*W,y=floorY(x)+r()*(H-floorY(x)),s=(r()*3+1)*U*(.6+(y-H*.84)/(H*.16));
    const v=110+r()*90|0;g.fillStyle=`rgba(${v},${v*.9|0},${v*.72|0},${.5+r()*.5})`;
    g.beginPath();g.ellipse(x,y,s*1.3,s*.8,r()*3,0,7);g.fill();
  }
  // sand shading at the front glass
  gr=g.createLinearGradient(0,H*.9,0,H);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.35)');
  g.fillStyle=gr;g.fillRect(0,H*.9,W,H*.1);
}
function buildPlants(){
  const r=rng(42);plants=[];
  const add=(x,layer,kind,n,h,col)=>plants.push({x,layer,kind,n,h:h*U,col,seed:r()*10,leaves:Array.from({length:n},()=>({lean:(r()-.5)*1.2,h:.6+r()*.5,w:.7+r()*.6}))});
  add(W*.05,'back','sword',9,170,[48,120,52]);
  add(W*.14,'back','grass',22,120,[70,140,60]);
  add(W*.44,'back','grass',16,90,[62,128,58]);
  add(W*.83,'back','sword',8,200,[40,108,48]);
  add(W*.93,'back','grass',18,150,[74,146,62]);
  add(W*.62,'back','grass',10,70,[110,150,58]);
  add(W*.30,'front','sword',6,110,[36,96,44]);
  add(W*.97,'front','grass',14,95,[52,118,50]);
  add(W*.02,'front','grass',12,80,[60,124,52]);
}
function drawPlant(p,t){
  const by=floorY(p.x)+6*U;
  p.leaves.forEach((l,i)=>{
    const spread=(i-(p.n-1)/2)*(p.kind==='sword'?7:4)*U;
    const bx=p.x+spread,h=p.h*l.h;
    const sway=Math.sin(t*.55+p.seed+i*.45)*h*.08+Math.sin(t*1.3+i)*h*.02;
    const tx=bx+l.lean*h*.45+sway,ty=by-h;
    const shade=.75+(i%3)*.12;const[cr,cg,cb]=p.col;
    if(p.kind==='sword'){
      const wd=(9+l.w*6)*U;
      const gr=c.createLinearGradient(bx,by,tx,ty);
      gr.addColorStop(0,`rgb(${cr*.5|0},${cg*.55|0},${cb*.5|0})`);gr.addColorStop(1,`rgb(${cr*shade*1.15|0},${cg*shade*1.15|0},${cb*shade|0})`);
      c.fillStyle=gr;c.beginPath();c.moveTo(bx,by);
      c.quadraticCurveTo(bx+(tx-bx)*.4-wd,by-h*.5,tx,ty);
      c.quadraticCurveTo(bx+(tx-bx)*.4+wd,by-h*.5,bx,by);c.fill();
      c.strokeStyle='rgba(220,255,200,.18)';c.lineWidth=1;c.beginPath();c.moveTo(bx,by);c.quadraticCurveTo(bx+(tx-bx)*.4,by-h*.5,tx,ty);c.stroke();
    }else{
      c.strokeStyle=`rgb(${cr*shade|0},${cg*shade|0},${cb*shade|0})`;c.lineWidth=(2+l.w*1.6)*U;c.lineCap='round';
      c.beginPath();c.moveTo(bx,by);c.quadraticCurveTo(bx+(tx-bx)*.3,by-h*.55,tx,ty);c.stroke();
    }
  });
}

/* ---------- fish runtime ---------- */
function fishLen(f){return SPECIES[f.sp].len*U*1.55*(.55+.45*f.growth)}
function spawn(f,fromTop){
  const s=SPECIES[f.sp];
  f.x=Math.random()*W*.8+W*.1;f.y=fromTop?-20:H*(s.band[0]+Math.random()*(s.band[1]-s.band[0]));
  f.vx=(Math.random()<.5?-1:1)*20*U;f.vy=0;f.dir=Math.sign(f.vx);f.ph=Math.random()*6;
  f.tx=f.x;f.ty=f.y;f.timer=0;
}
let school={x:0,y:0,tx:0,ty:0,timer:0};
function pickTarget(f){
  const s=SPECIES[f.sp];
  if(f.full<25){f.tx=W*(.25+Math.random()*.5);f.ty=H*(.08+Math.random()*.07);f.timer=1.5+Math.random()*2;return} // begging at the surface
  if(s.school){f.tx=school.x+(Math.random()-.5)*90*U;f.ty=school.y+(Math.random()-.5)*50*U}
  else{f.tx=W*.08+Math.random()*W*.84;f.ty=H*(s.band[0]+Math.random()*(s.band[1]-s.band[0]))}
  f.timer=3+Math.random()*6;
}

/* ---------- food, bubbles, wipes ---------- */
let pellets=[],bubbles=[],wipes=[];
function feed(x){
  for(let i=0;i<4;i++)pellets.push({x:x+(Math.random()-.5)*36*U,y:-4-Math.random()*30,vy:(26+Math.random()*10)*U,landed:false,age:0,s:Math.random()*6});
}

/* ---------- light ---------- */
function lightLevel(){
  const d=new Date();const h=HOUR_OVERRIDE!=null?HOUR_OVERRIDE:d.getHours()+d.getMinutes()/60;
  if(h>=8&&h<18)return 1; if(h>=21||h<6)return 0;
  return h<8?(h-6)/2:1-(h-18)/3;
}

/* ---------- drawing fish ---------- */
const TAILS={fan:[.38,.62,.72],fork:[.30,.58,.42],big:[.58,1.05,.86],veil:[.78,1.35,.92],small:[.16,.4,.7]};
function bodyPath(L,Hh){
  c.beginPath();c.moveTo(L*.5,Hh*.04);
  c.bezierCurveTo(L*.45,-Hh*.55,-L*.18,-Hh*.62,-L*.44,-Hh*.1);
  c.lineTo(-L*.44,Hh*.1);
  c.bezierCurveTo(-L*.18,Hh*.56,L*.42,Hh*.52,L*.5,Hh*.04);c.closePath();
}
function finFill(s,alpha){c.fillStyle=s.fin;c.globalAlpha=alpha}
function drawFish(f,t,light){
  const s=SPECIES[f.sp],L=fishLen(f),Hh=L*s.h,w=Math.sin(f.ph);
  if(!(L>4))return;
  c.save();c.translate(f.x,f.y);
  const sx=Math.abs(f.dir)<.14?(f.dir<0?-.14:.14):f.dir;
  c.scale(sx,1);
  c.rotate(Math.max(-.4,Math.min(.4,f.vy/(Math.abs(f.vx)+25*U)*.7))+(SICK?.16:0));
  // soft shadow-ish depth
  // tail
  const [tl,th,notch]=TAILS[s.tail];const bx=-L*.42,TL=L*tl,TH=Hh*th*(s.tail==='veil'?1:1),wy=w*Hh*(s.tail==='veil'?.38:.22),sk=w*TL*.08;
  finFill(s,s.finA);
  c.beginPath();c.moveTo(bx,-Hh*.12);
  c.quadraticCurveTo(bx-TL*.45,-TH*.62+wy*.5,bx-TL+sk,-TH+wy);
  c.quadraticCurveTo(bx-TL*notch,wy*.6,bx-TL+sk,TH+wy*(s.tail==='veil'?1.4:1));
  c.quadraticCurveTo(bx-TL*.45,TH*.62+wy*.5,bx,Hh*.12);c.closePath();c.fill();
  c.globalAlpha=s.finA*.35;c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=.7;
  for(let k=-2;k<=2;k++){c.beginPath();c.moveTo(bx,k*Hh*.04);c.lineTo(bx-TL*.92+sk,k*TH*.38+wy*.85);c.stroke()}
  if(s.tailPattern){c.globalAlpha=.75;c.fillStyle='#2a3c8f';for(let k=0;k<5;k++){c.beginPath();c.arc(bx-TL*(.35+k*.1),(k%2?-1:1)*TH*.25*(k*.3)+wy*.6,Hh*.07,0,7);c.fill()}}
  // dorsal / anal fins (behind body)
  finFill(s,s.finA*.9);
  if(s.dorsal==='tall'){
    c.beginPath();c.moveTo(L*.12,-Hh*.42);c.quadraticCurveTo(-L*.05,-Hh*.9,-L*.3+w*L*.03,-Hh*1.35);c.quadraticCurveTo(-L*.22,-Hh*.6,-L*.38,-Hh*.18);c.fill();
    c.beginPath();c.moveTo(L*.1,Hh*.42);c.quadraticCurveTo(-L*.05,Hh*.9,-L*.3-w*L*.03,Hh*1.35);c.quadraticCurveTo(-L*.22,Hh*.6,-L*.38,Hh*.18);c.fill();
  }else if(s.dorsal==='long'){
    c.beginPath();c.moveTo(L*.05,-Hh*.45);c.quadraticCurveTo(-L*.2,-Hh*1.15,-L*.55+w*L*.04,-Hh*.95+wy*.3);c.quadraticCurveTo(-L*.4,-Hh*.4,-L*.42,-Hh*.12);c.fill();
    c.beginPath();c.moveTo(L*.2,Hh*.4);c.quadraticCurveTo(-L*.1,Hh*1.3+wy*.4,-L*.5+w*L*.05,Hh*1.25+wy);c.quadraticCurveTo(-L*.38,Hh*.5,-L*.42,Hh*.12);c.fill();
  }else if(s.dorsal==='round'){
    c.save();c.scale(1.07,1.22);bodyPath(L,Hh);c.fill();c.restore();
  }else{
    const k=s.dorsal==='mid'?1:.6;
    c.beginPath();c.moveTo(L*.06,-Hh*.47);c.quadraticCurveTo(-L*.08,-Hh*(.5+.45*k),-L*.22+w*L*.02,-Hh*(.45+.42*k));c.quadraticCurveTo(-L*.2,-Hh*.5,-L*.3,-Hh*.32);c.fill();
    c.beginPath();c.moveTo(-L*.1,Hh*.42);c.quadraticCurveTo(-L*.2,Hh*(.5+.35*k),-L*.3-w*L*.02,Hh*(.42+.3*k));c.lineTo(-L*.36,Hh*.22);c.fill();
  }
  c.globalAlpha=1;
  // body
  bodyPath(L,Hh);
  let gr=c.createLinearGradient(0,-Hh*.55,0,Hh*.55);
  gr.addColorStop(0,s.top);gr.addColorStop(.42,s.mid);gr.addColorStop(1,s.belly);
  c.fillStyle=gr;c.fill();
  c.save();bodyPath(L,Hh);c.clip();
  drawPattern(s,L,Hh,t);
  // top light from the surface, shading underneath
  gr=c.createLinearGradient(0,-Hh*.6,0,Hh*.6);
  gr.addColorStop(0,`rgba(255,255,255,${.22*light})`);gr.addColorStop(.35,'rgba(255,255,255,0)');gr.addColorStop(.8,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.28)');
  c.fillStyle=gr;c.fillRect(-L,-Hh,L*2,Hh*2);
  // hunger pales the colours
  if(SICK){c.fillStyle='rgba(150,175,150,.28)';c.fillRect(-L,-Hh,L*2,Hh*2)}
  if(f.full<30){c.fillStyle=`rgba(150,160,170,${(1-f.full/30)*.45})`;c.fillRect(-L,-Hh,L*2,Hh*2)}
  // gill
  c.strokeStyle='rgba(0,0,0,.22)';c.lineWidth=Math.max(.8,L*.012);
  c.beginPath();c.arc(L*.42,0,Hh*.42,Math.PI*.72,Math.PI*1.28);c.stroke();
  c.restore();
  // pectoral fin
  finFill(s,s.finA*.8);
  c.save();c.translate(L*.18,Hh*.16);c.rotate(.5+Math.sin(f.ph*1.6)*.35);
  c.beginPath();c.ellipse(-L*.06,0,L*.1,Hh*.07+L*.012,0,0,7);c.fill();c.restore();
  c.globalAlpha=1;
  // eye
  const er=Math.max(1.6,L*.052),ex=L*.34,ey=-Hh*.08;
  c.fillStyle='#e8e2d0';c.beginPath();c.arc(ex,ey,er,0,7);c.fill();
  c.fillStyle='#0b0b10';c.beginPath();c.arc(ex+er*.12,ey,er*.66,0,7);c.fill();
  c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.arc(ex+er*.35,ey-er*.3,er*.22,0,7);c.fill();
  // mouth opens when near food
  if(f.eating>0){c.fillStyle='rgba(40,10,10,.6)';c.beginPath();c.ellipse(L*.5,Hh*.05,L*.02,Hh*.06,0,0,7);c.fill()}
  c.restore();
}
function drawPattern(s,L,Hh,t){
  if(s.pattern==='neon'){
    c.globalCompositeOperation='lighter';
    const sh=.75+Math.sin(t*2)*.25;
    c.fillStyle=`rgba(40,190,255,${.85*sh})`;
    c.beginPath();c.moveTo(L*.36,-Hh*.12);c.quadraticCurveTo(0,-Hh*.24,-L*.46,-Hh*.06);c.lineTo(-L*.46,Hh*.06);c.quadraticCurveTo(0,-Hh*.02,L*.36,-Hh*.02);c.fill();
    c.globalCompositeOperation='source-over';
    c.fillStyle='rgba(228,40,52,.92)';
    c.beginPath();c.moveTo(L*.02,Hh*.04);c.quadraticCurveTo(-L*.2,0,-L*.46,Hh*.08);c.lineTo(-L*.46,Hh*.5);c.lineTo(L*.02,Hh*.5);c.fill();
  }else if(s.pattern==='bars'){
    c.fillStyle='rgba(30,26,22,.78)';
    for(const x of [L*.32,L*.06,-L*.22]){c.beginPath();c.moveTo(x+L*.04,-Hh);c.quadraticCurveTo(x-L*.02,0,x+L*.04,Hh);c.lineTo(x-L*.03,Hh);c.quadraticCurveTo(x-L*.09,0,x-L*.03,-Hh);c.fill()}
  }else if(s.pattern==='waves'){
    c.strokeStyle='rgba(60,170,200,.75)';c.lineWidth=L*.022;
    for(let k=0;k<9;k++){const x=L*.42-k*L*.1;c.beginPath();for(let y=-Hh*.6;y<=Hh*.6;y+=Hh*.05){const xx=x+Math.sin(y/Hh*9+k)*L*.025;y===-Hh*.6?c.moveTo(xx,y):c.lineTo(xx,y)}c.stroke()}
  }else if(s.pattern==='scales'){
    c.strokeStyle='rgba(255,240,200,.2)';c.lineWidth=.8;const r=L*.045;
    for(let y=-Hh*.5;y<Hh*.5;y+=r*1.1)for(let x=L*.28;x>-L*.45;x-=r*1.3){c.beginPath();c.arc(x+((y/r|0)%2)*r*.65,y,r,-1.2,1.2);c.stroke()}
  }else if(s.pattern==='spots'||s.pattern==='dots'){
    c.fillStyle=s.pattern==='spots'?'rgba(255,120,70,.6)':'rgba(50,44,36,.55)';
    const pts=s.pattern==='spots'?[[-.25,-.1],[-.33,.12],[-.15,.08]]:[[.1,-.15],[-.05,.05],[-.2,-.12],[-.3,.08],[.0,-.28],[-.15,.22]];
    for(const[a,b]of pts){c.beginPath();c.arc(L*a,Hh*b,L*.04,0,7);c.fill()}
  }else if(s.pattern==='iris'){
    c.globalCompositeOperation='lighter';c.fillStyle='rgba(80,160,255,.25)';
    for(let k=0;k<12;k++){c.beginPath();c.arc(L*(.3-k*.06),Math.sin(k*1.7)*Hh*.25,L*.03,0,7);c.fill()}
    c.globalCompositeOperation='source-over';
  }
}

/* ---------- main loop ---------- */
let lastT=performance.now(),saveClock=0,uiClock=0,calClock=0;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;const t=now/1000;
  simulate(dt/3600*SIM);saveClock+=dt;uiClock+=dt;
  if(saveClock>5){saveClock=0;save()}
  if(uiClock>1){uiClock=0;checkMeals();renderMealBanner();checkMeds();renderMedBtn();updateBubble();if(++calClock>=300){calClock=0;fetchCalls()}renderStats();if(!panel.hidden)renderPanel();while(queuedToasts.length)toast(queuedToasts.shift())}
  const light=lightLevel();update(dt,t,light);draw(t,light);
  requestAnimationFrame(frame);
}
function update(dt,t,light){
  // school drift
  school.timer-=dt;
  if(school.timer<=0){school.tx=W*.15+Math.random()*W*.7;school.ty=H*(.3+Math.random()*.28);school.timer=6+Math.random()*6}
  school.x+=(school.tx-school.x)*dt*.25;school.y+=(school.ty-school.y)*dt*.25;
  SICK=pendingDoses().some(d=>d.due<=Date.now());const night=.45+.55*light,sick=SICK?.7:1;
  for(const f of S.fish){
    const s=SPECIES[f.sp],L=fishLen(f);
    let spd=s.speed*42*U*night*sick*(f.full<20?.6:1),tgt=null,best=1e9;
    if(f.full<95){for(const p of pellets){const d=Math.hypot(p.x-f.x,p.y-f.y);if(d<best){best=d;tgt=p}}}
    if(tgt&&best<Math.max(W,H)*.9){f.tx=tgt.x;f.ty=tgt.y;spd*=2.3}
    else{f.timer-=dt;if(f.timer<=0||Math.hypot(f.tx-f.x,f.ty-f.y)<20*U)pickTarget(f)}
    const dx=f.tx-f.x,dy=f.ty-f.y,d=Math.hypot(dx,dy)||1;
    const ease=Math.min(1,d/(60*U));
    const k=Math.min(1,dt*(tgt?2.4:1.1));
    f.vx+=(dx/d*spd*ease-f.vx)*k;f.vy+=(dy/d*spd*ease*.7-f.vy)*k;
    if(!tgt&&Math.abs(f.vx)<6*U)f.vx+=Math.sign(f.vx||1)*U*dt*10;
    f.x+=f.vx*dt;f.y+=f.vy*dt;
    const top=H*.06+L*.3,bot=floorY(f.x)-L*s.h*.5;
    f.x=Math.max(L*.6,Math.min(W-L*.6,f.x));f.y=Math.max(top,Math.min(bot,f.y));
    const want=Math.abs(f.vx)>3*U?Math.sign(f.vx):Math.sign(f.dir||1);
    f.dir+=(want-f.dir)*Math.min(1,dt*3.2);
    f.ph+=dt*(4+Math.hypot(f.vx,f.vy)/(U*9));
    f.eating=Math.max(0,(f.eating||0)-dt);
    if(tgt){
      const mx=f.x+Math.sign(f.dir)*L*.48,my=f.y;
      const dd=Math.min(Math.hypot(tgt.x-mx,tgt.y-my),Math.hypot(tgt.x-f.x,tgt.y-f.y));
      if(dd<Math.max(9*U,L*.25,tgt.landed?L*s.h*.6:0)){pellets.splice(pellets.indexOf(tgt),1);f.full=Math.min(100,f.full+7);f.eating=.35}
    }
  }
  for(const p of pellets){
    p.age+=dt;
    if(!p.landed){p.y+=p.vy*dt;p.x+=Math.sin(t*2+p.s)*6*U*dt;if(p.y>=floorY(p.x)-2*U){p.y=floorY(p.x)-2*U;p.landed=true;p.age=0}}
    else if(p.age>90){p.gone=true;S.dirt=Math.min(100,S.dirt+RATE.pelletDirt)}
  }
  pellets=pellets.filter(p=>!p.gone);
  if(Math.random()<dt*9)bubbles.push({x:W*.885+(Math.random()-.5)*6*U,y:floorY(W*.885)-4*U,r:(1.5+Math.random()*3)*U,p:Math.random()*6});
  for(const b of bubbles){b.y-=(40+b.r*12)*U*dt;b.x+=Math.sin(t*3+b.p)*10*U*dt;if(b.y<H*.04)b.gone=true}
  bubbles=bubbles.filter(b=>!b.gone);
  wipes=wipes.filter(w=>t-w.t<.9);
  if(bubble){const ty=floorY(bubble.x)-bubble.r*.94;bubble.r=Math.min(W,H)*.2;const sink=Math.min(H/20,Math.max(0,ty-bubble.y)*.6);bubble.y=Math.min(ty,bubble.y+sink*dt);bubble.x=W*.5+Math.sin(t*.35+bubble.p)*W*.05*Math.min(1,Math.max(0,ty-bubble.y)/(H*.2))}
  for(const d of popFx){d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx*=1-dt*3;d.vy=d.vy*(1-dt*3)+40*U*dt;d.life-=dt*1.6}
  popFx=popFx.filter(d=>d.life>0);
  for(const f of S.fish)if(f.glow>0)f.glow-=dt;
  if(capsule){capsule.y+=capsule.vy*dt;capsule.rot+=dt*1.5;capsule.x+=Math.sin(t*2)*10*U*dt;
    if(capsule.y>H*.42){for(let i=0;i<60;i++){const a=Math.random()*Math.PI*2,sp=(40+Math.random()*220)*U;sparks.push({x:capsule.x,y:capsule.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,r:(1.5+Math.random()*3)*U,h:Math.random()<.5?320:170})}
      for(const f of S.fish){f.glow=8;f.tx=capsule.x+(Math.random()-.5)*120*U;f.ty=capsule.y+(Math.random()-.5)*80*U;f.timer=3}
      tone(520,1040,.35,.12);capsule=null}}
  for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*2;p.vy=p.vy*(1-dt*2)-8*U*dt;p.life-=dt*.6}
  sparks=sparks.filter(p=>p.life>0);if(ring){ring.life-=dt*3;if(ring.life<=0)ring=null}
}
function draw(t,light){
  c.setTransform(DPR,0,0,DPR,0,0);
  c.drawImage(bg,0,0,W,H);
  // caustics on the sand
  c.globalCompositeOperation='lighter';
  for(let i=0;i<34;i++){
    const x=(i*97.3+Math.sin(t*.35+i)*60*U)%W,yb=floorY(x);
    c.fillStyle=`rgba(255,250,215,${.045*light})`;
    c.beginPath();c.ellipse(x,yb+((i*13)%40)*U*.6,(26+Math.sin(t+i)*8)*U,(5+Math.sin(t*.8+i*2)*2)*U,Math.sin(i),0,7);c.fill();
  }
  // light rays
  for(let i=0;i<5;i++){
    const x=W*(.1+i*.2)+Math.sin(t*.12+i*1.7)*W*.05,w=W*(.04+((i*7)%3)*.02);
    const gr=c.createLinearGradient(0,0,0,H*.85);
    gr.addColorStop(0,`rgba(220,245,255,${(.09+Math.sin(t*.4+i)*.03)*light})`);gr.addColorStop(1,'rgba(220,245,255,0)');
    c.fillStyle=gr;c.beginPath();c.moveTo(x,0);c.lineTo(x+w,0);c.lineTo(x+w*2.6+W*.08,H*.85);c.lineTo(x+W*.06,H*.85);c.fill();
  }
  c.globalCompositeOperation='source-over';
  for(const p of plants)if(p.layer==='back')drawPlant(p,t);
  // food
  for(const p of pellets){c.fillStyle='#a8692c';c.beginPath();c.arc(p.x,p.y,2.4*U,0,7);c.fill();c.fillStyle='rgba(255,210,150,.6)';c.beginPath();c.arc(p.x-.7*U,p.y-.7*U,.9*U,0,7);c.fill()}
  // fish, small ones first so bigger fish read as nearer
  const order=[...S.fish].sort((a,b)=>fishLen(a)-fishLen(b));
  for(const f of order)drawFish(f,t,light);
  drawMeds(t);
  for(const p of plants)if(p.layer==='front')drawPlant(p,t);
  // bubbles
  c.lineWidth=1;
  for(const b of bubbles){c.strokeStyle='rgba(230,248,255,.55)';c.beginPath();c.arc(b.x,b.y,b.r,0,7);c.stroke();c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.arc(b.x-b.r*.35,b.y-b.r*.35,b.r*.28,0,7);c.fill()}
  // floating motes (more when dirty)
  const n=18+Math.round(S.dirt*.5);
  for(let i=0;i<n&&i<motes.length;i++){const m=motes[i];const x=(m.x+Math.sin(t*.2+m.p)*20*U)%W,y=(m.y+t*m.s*U)%(H*.85);c.fillStyle=`rgba(220,230,200,${.18+S.dirt/400})`;c.beginPath();c.arc(x,y,m.r*U,0,7);c.fill()}
  // murky water + algae on the glass
  if(S.dirt>3){
    const a=S.dirt/100;
    c.fillStyle=`rgba(70,92,40,${a*.4})`;c.fillRect(0,0,W,H);
    for(const[cx,cy]of[[0,0],[W,0],[0,H],[W,H]]){const gr=c.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.55);gr.addColorStop(0,`rgba(60,100,30,${a*.55})`);gr.addColorStop(1,'rgba(60,100,30,0)');c.fillStyle=gr;c.fillRect(0,0,W,H)}
  }
  // wipe streaks
  c.lineCap='round';
  for(const w of wipes){const age=(t-w.t)/.9;c.strokeStyle=`rgba(230,250,255,${.22*(1-age)})`;c.lineWidth=46*U;c.beginPath();c.moveTo(w.x0,w.y0);c.lineTo(w.x1,w.y1);c.stroke()}
  // night
  if(light<1){c.fillStyle=`rgba(2,8,26,${(1-light)*.68})`;c.fillRect(0,0,W,H);
    const gr=c.createRadialGradient(W*.7,-H*.1,0,W*.7,-H*.1,H*.9);gr.addColorStop(0,`rgba(120,150,220,${(1-light)*.12})`);gr.addColorStop(1,'rgba(120,150,220,0)');c.fillStyle=gr;c.fillRect(0,0,W,H)}
  // glass reflection
  const gr=c.createLinearGradient(0,0,W*.4,H*.5);gr.addColorStop(0,'rgba(255,255,255,.05)');gr.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=gr;c.fillRect(0,0,W,H);
  drawBubble(t);drawPop();
}

  down={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,t:performance.now(),dist:0};wake();poke();unlockAudio();
  if(bubble&&Math.hypot(e.clientX-bubble.x,e.clientY-bubble.y)<bubble.r*1.05){down.popped=true;popBubble();return}
  if(sickFishAt(e.clientX,e.clientY)){down.med=true;if(e.pointerType!=='mouse')down.hold=setTimeout(()=>{if(down&&down.med){down.held=true;showTip(down.x,down.y,true)}},450);return}
  hideTip();
});

  if(!down){if(e.pointerType==='mouse'){if(sickFishAt(e.clientX,e.clientY))showTip(e.clientX,e.clientY,false);else if(!tipTimer||tip.hidden)hideTip()}return}
  const d=Math.hypot(e.clientX-down.lx,e.clientY-down.ly);down.dist+=d;
  if(down.dist>28&&d>0&&!down.popped){
    S.dirt=Math.max(0,S.dirt-d/W*32);
    wipes.push({x0:down.lx,y0:down.ly,x1:e.clientX,y1:e.clientY,t:performance.now()/1000});
    pellets=pellets.filter(p=>!(p.landed&&Math.hypot(p.x-e.clientX,p.y-e.clientY)<40*U));
  }
  down.lx=e.clientX;down.ly=e.clientY;
});
const up=e=>{if(down&&down.med){clearTimeout(down.hold);if(!down.held&&down.dist<28)giveNow();down=null;return}if(down&&down.popped){down=null;return}if(down&&down.dist<28&&performance.now()-down.t<600){feed(down.x);hideHint()}else if(down&&down.dist>=28){hideHint()}down=null};

}
function esc(s){return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
panel.addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='impMed'){const b=document.getElementById('impBox');b.hidden=!b.hidden;return}
  if(t.id==='impGo'){const err=document.getElementById('impErr');
    try{const raw=document.getElementById('impText').value.trim().replace(/^AQMEDS:/,'');
      const list=JSON.parse(decodeURIComponent(escape(atob(raw))));
      if(!Array.isArray(list)||!list.length||!list.every(m=>m.name&&/^\d\d:\d\d$/.test(m.time)))throw 0;
      S.meds=list.map((m,i)=>({id:'m'+Date.now().toString(36)+i,name:String(m.name).slice(0,28),time:m.time,day:m.day==null?-1:+m.day})).sort((a,b)=>a.time.localeCompare(b.time));
      S.medCheck=Date.now();save();renderMeds();renderMedBtn();toast(`Imported ${S.meds.length} meds`);
    }catch(e){err.textContent='That code didn\'t work. Copy the whole thing, starting with AQMEDS:'}
    return}
  if(t.id==='addMed'){S.meds.push({id:'m'+Date.now().toString(36),name:'',time:'08:00',day:-1});S.medCheck=Date.now();save();renderMeds();return}
  if(t.dataset&&t.dataset.mdel!=null){const m=S.meds[+t.dataset.mdel];S.meds.splice(+t.dataset.mdel,1);if(m)S.medLog=S.medLog.filter(d=>d.medId!==m.id||d.given||d.missed);save();renderMeds();renderMedBtn();return}
  if(t.id==='calOn'){const v=document.getElementById('calUrl').value.trim();
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(v)){S.cal.err='That doesn\'t look like the calendar link. It starts with https://script.google.com/';renderCal();return}
    S.cal.url=v;S.cal.err='';save();t.textContent='Connecting…';fetchCalls().then(()=>{if(S.cal.err){S.cal.url=''}save();renderCal();renderStats()});return}
  if(t.id==='calOff'){S.cal={url:'',calls:[],fetched:0,err:''};save();renderCal();renderStats();return}
  if(t.id==='calRefresh'){t.textContent='Refreshing…';fetchCalls().then(()=>{renderCal();renderStats()});return}
  if(t.id==='addMeal'){S.meals.push({label:'Meal',time:'10:00'});save();renderMeals();return}
  if(t.dataset&&t.dataset.del!=null){S.meals.splice(+t.dataset.del,1);save();renderMeals();renderPanel();return}
  const id=t.dataset&&t.dataset.id;if(!id)return;
  const f=S.fish.find(x=>x.id===id);const n=prompt('New name for '+f.name,f.name);
  if(n&&n.trim()){f.name=n.trim().slice(0,24);save();renderPanel()}
});
panel.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.mi!=null){const m=S.meds[+t.dataset.mi];if(!m)return;m[t.dataset.mk]=t.dataset.mk==='day'?+t.value:(t.value.trim()||(t.dataset.mk==='time'?m.time:''));
    S.meds.sort((a,b)=>a.time.localeCompare(b.time));S.medCheck=Date.now();save();renderMeds();renderMedBtn();return}
  if(t.dataset.i==null)return;
  const m=S.meals[+t.dataset.i];if(!m)return;
  m[t.dataset.k]=t.value.trim()||(t.dataset.k==='label'?'Meal':m.time);
  S.meals.sort((a,b)=>a.time.localeCompare(b.time));
  S.mealCheck=Date.now();save();renderMeals();renderPanel();
});
document.getElementById('fishBtn').addEventListener('click',()=>{panel.hidden=!panel.hidden;if(!panel.hidden){renderPanel();renderMeals();renderMeds();renderCal()}renderMealBanner();poke()});
let toastTimer;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('on'),4500)}

/* ---------- keep the screen on ---------- */
let lock=null;
async function wake(){try{if('wakeLock'in navigator&&!lock&&document.visibilityState==='visible'){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){catchUp();checkMeals();checkMeds();renderMedBtn();fetchCalls();wake()}else save()});
addEventListener('pagehide',save);

/* ---------- start ---------- */
catchUp();checkMeals();checkMeds();fetchCalls();
addEventListener('resize',resize);resize();
school.x=W/2;school.y=H*.45;
renderStats();renderMealBanner();renderMedBtn();poke();
setTimeout(()=>{while(queuedToasts.length)toast(queuedToasts.shift())},800);
requestAnimationFrame(frame);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
